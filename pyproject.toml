[project]
name = "aspire-mcp"
version = "1.1.0"
description = "Connect Aspire to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Aspire API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["aspire", "aspire api", "aspire mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/aspire-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=aspire"
Source = "https://github.com/cotlet-connect/aspire-mcp"

[project.scripts]
aspire-mcp = "aspire_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"aspire_agent.py" = "aspire_agent.py"

[tool.hatch.build.targets.sdist]
include = ["aspire_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
